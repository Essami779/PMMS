<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; direction: rtl;">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
        </filter>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#047857" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
        <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b91c1c" />
            <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6b21a8" />
            <stop offset="100%" stop-color="#9333ea" />
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
        </marker>
    </defs>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="1200" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">الشكل (1-1): مخطط جانت الزمني لمراحل تنفيذ المشروع</text>
    
    
    <rect x="50" y="80" width="1100" height="40" fill="#1e293b" rx="4"/>
    <text x="100" y="105" fill="#ffffff" font-weight="bold" font-size="14">م</text>
    <text x="350" y="105" fill="#ffffff" font-weight="bold" font-size="14">مرحلة العمل البرمجي والإداري</text>
    <text x="650" y="105" fill="#ffffff" font-weight="bold" font-size="14">المدة الزمنية</text>
    <text x="950" y="105" fill="#ffffff" font-weight="bold" font-size="14">الجدول الزمني لمراحل التنفيذ</text>

    <!-- Rows -->
    <rect x="50" y="130" width="1100" height="50" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="100" y="160" font-size="14" fill="#334155">1</text>
    <text x="350" y="160" font-size="14" font-weight="600" fill="#0f172a">جمع المتطلبات وتحليل البوابات الخمس</text>
    <text x="650" y="160" font-size="14" fill="#475569">أسبوعان</text>
    <rect x="750" y="142" width="150" height="26" fill="url(#primaryGrad)" rx="13" filter="url(#shadow)"/>
    <text x="825" y="160" fill="#ffffff" font-size="12" text-anchor="middle">المرحلة الأولى</text>

    <rect x="50" y="190" width="1100" height="50" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="100" y="220" font-size="14" fill="#334155">2</text>
    <text x="350" y="220" font-size="14" font-weight="600" fill="#0f172a">التصميم المعماري (DFD, ERD, UML)</text>
    <text x="650" y="220" font-size="14" fill="#475569">3 أسابيع</text>
    <rect x="820" y="202" width="180" height="26" fill="url(#accentGrad)" rx="13" filter="url(#shadow)"/>
    <text x="910" y="220" fill="#ffffff" font-size="12" text-anchor="middle">المرحلة الثانية</text>

    <rect x="50" y="250" width="1100" height="50" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="100" y="280" font-size="14" fill="#334155">3</text>
    <text x="350" y="280" font-size="14" font-weight="600" fill="#0f172a">تطوير الـ Backend (Laravel REST APIs)</text>
    <text x="650" y="280" font-size="14" fill="#475569">4 أسابيع</text>
    <rect x="880" y="262" width="200" height="26" fill="url(#primaryGrad)" rx="13" filter="url(#shadow)"/>
    <text x="980" y="280" fill="#ffffff" font-size="12" text-anchor="middle">المرحلة الثالثة (أ)</text>

    <rect x="50" y="310" width="1100" height="50" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="100" y="340" font-size="14" fill="#334155">4</text>
    <text x="350" y="340" font-size="14" font-weight="600" fill="#0f172a">تطوير واجهات وتطبيق Flutter (ويب وموبايل)</text>
    <text x="650" y="340" font-size="14" fill="#475569">4 أسابيع</text>
    <rect x="910" y="322" width="200" height="26" fill="url(#accentGrad)" rx="13" filter="url(#shadow)"/>
    <text x="1010" y="340" fill="#ffffff" font-size="12" text-anchor="middle">المرحلة الثالثة (ب)</text>

    <rect x="50" y="370" width="1100" height="50" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="100" y="400" font-size="14" fill="#334155">5</text>
    <text x="350" y="400" font-size="14" font-weight="600" fill="#0f172a">دمج المزامنة أوفلاين والذكاء الاصطناعي المحلي</text>
    <text x="650" y="400" font-size="14" fill="#475569">3 أسابيع</text>
    <rect x="960" y="382" width="160" height="26" fill="url(#purpleGrad)" rx="13" filter="url(#shadow)"/>
    <text x="1040" y="400" fill="#ffffff" font-size="12" text-anchor="middle">المرحلة الثالثة (ج)</text>

    <rect x="50" y="430" width="1100" height="50" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="100" y="460" font-size="14" fill="#334155">6</text>
    <text x="350" y="460" font-size="14" font-weight="600" fill="#0f172a">الاختبارات التشغيلية والرفع والتوثيق</text>
    <text x="650" y="460" font-size="14" fill="#475569">أسبوعان</text>
    <rect x="1000" y="442" width="130" height="26" fill="url(#warnGrad)" rx="13" filter="url(#shadow)"/>
    <text x="1065" y="460" fill="#ffffff" font-size="12" text-anchor="middle">المرحلة الرابعة</text>

</svg>