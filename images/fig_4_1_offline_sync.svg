<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; direction: rtl;">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
        </filter>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#047857" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
        <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b91c1c" />
            <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6b21a8" />
            <stop offset="100%" stop-color="#9333ea" />
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
        </marker>
    </defs>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="1200" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">الشكل (4-1): خوارزمية حل التعارض وتأكيد المزامنة الأوفلاين</text>
    
    
    <rect x="460" y="80" width="280" height="50" fill="#1e293b" rx="8" filter="url(#shadow)"/>
    <text x="600" y="110" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">1. بدء عملية المزامنة</text>

    <path d="M 600 130 L 600 160" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

    <polygon points="600,160 720,200 600,240 480,200" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="600" y="205" font-size="12" font-weight="bold" fill="#78350f" text-anchor="middle">2. هل يتوفر شبكة إنترنت؟</text>

    <path d="M 720 200 L 850 200 L 850 260" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="785" y="190" font-size="12" font-weight="bold" fill="#b91c1c">لا (Offline)</text>

    <rect x="710" y="260" width="280" height="50" fill="#fff1f2" stroke="#e11d48" rx="8" filter="url(#shadow)"/>
    <text x="850" y="290" font-size="13" font-weight="bold" fill="#9f1239" text-anchor="middle">3. حفظ البيانات محلياً SQLite</text>

    <path d="M 480 200 L 350 200 L 350 260" stroke="#15803d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="415" y="190" font-size="12" font-weight="bold" fill="#15803d">نعم (Online)</text>

    <rect x="210" y="260" width="280" height="50" fill="#f0fdf4" stroke="#16a34a" rx="8" filter="url(#shadow)"/>
    <text x="350" y="290" font-size="13" font-weight="bold" fill="#14532d" text-anchor="middle">4. تحديث السيرفر وحل التعارض بـ CRDT</text>

    <path d="M 350 310 L 350 360 L 600 360" stroke="#15803d" stroke-width="2"/>
    <path d="M 850 310 L 850 360 L 600 360" stroke="#475569" stroke-width="2"/>
    <path d="M 600 360 L 600 390" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="460" y="390" width="280" height="50" fill="#15803d" rx="8" filter="url(#shadow)"/>
    <text x="600" y="420" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">5. اكتملت المزامنة بنجاح</text>

</svg>