<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; direction: rtl;">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
        </filter>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#047857" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
        <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b91c1c" />
            <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6b21a8" />
            <stop offset="100%" stop-color="#9333ea" />
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
        </marker>
    </defs>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="1200" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">الشكل (3-6): مخطط التسلسل الأكاديمي لمهمة فحص الكود بالـ AI المحلي</text>
    
    
    <!-- Lifelines -->
    <rect x="950" y="80" width="160" height="50" fill="#1e293b" rx="6"/>
    <text x="1030" y="110" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">المطور (Developer)</text>
    <line x1="1030" y1="130" x2="1030" y2="460" stroke="#cbd5e1" stroke-dasharray="4,4" stroke-width="2"/>

    <rect x="670" y="80" width="160" height="50" fill="#2563eb" rx="6"/>
    <text x="750" y="110" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">Flutter UI / Web</text>
    <line x1="750" y1="130" x2="750" y2="460" stroke="#cbd5e1" stroke-dasharray="4,4" stroke-width="2"/>

    <rect x="390" y="80" width="160" height="50" fill="#7e22ce" rx="6"/>
    <text x="470" y="110" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">Local Ollama AI</text>
    <line x1="470" y1="130" x2="470" y2="460" stroke="#cbd5e1" stroke-dasharray="4,4" stroke-width="2"/>

    <rect x="110" y="80" width="160" height="50" fill="#15803d" rx="6"/>
    <text x="190" y="110" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">PostgreSQL / DB</text>
    <line x1="190" y1="130" x2="190" y2="460" stroke="#cbd5e1" stroke-dasharray="4,4" stroke-width="2"/>

    <!-- Step 1 -->
    <path d="M 1030 160 L 750 160" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="890" y="152" font-size="12" fill="#0f172a" text-anchor="middle">1. رفع الأكواد البرمجية (git push)</text>

    <!-- Step 2 -->
    <path d="M 750 210 L 470 210" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="610" y="202" font-size="12" fill="#1e3a8a" text-anchor="middle">2. إرسال الكود للفحص المحلي أوفلاين</text>

    <!-- Step 3 -->
    <rect x="420" y="240" width="100" height="40" fill="#faf5ff" stroke="#7e22ce" rx="4"/>
    <text x="470" y="265" font-size="11" font-weight="bold" fill="#6b21a8" text-anchor="middle">فحص الجودة 100% محلياً</text>

    <!-- Step 4 -->
    <path d="M 470 310 L 750 310" stroke="#7e22ce" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <text x="610" y="302" font-size="12" fill="#6b21a8" text-anchor="middle">3. إرجاع تقرير الثغرات وتقييم الأمان</text>

    <!-- Step 5 -->
    <path d="M 750 360 L 190 360" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="470" y="352" font-size="12" fill="#1e3a8a" text-anchor="middle">4. حفظ نتائج الفحص وتحديث المهمة</text>

    <!-- Step 6 -->
    <path d="M 190 410 L 750 410" stroke="#15803d" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <text x="470" y="402" font-size="12" fill="#14532d" text-anchor="middle">5. تأكيد القيد وحفظ العملية (200 OK)</text>

    <!-- Step 7 -->
    <path d="M 750 440 L 1030 440" stroke="#15803d" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="890" y="432" font-size="12" fill="#14532d" text-anchor="middle">6. عرض شارة الأمان والتنبيهات بالواجهة</text>

</svg>