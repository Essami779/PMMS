<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; direction: rtl;">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
        </filter>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#047857" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
        <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b91c1c" />
            <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6b21a8" />
            <stop offset="100%" stop-color="#9333ea" />
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
        </marker>
    </defs>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="1200" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">الشكل (3-5): مخطط الفئات الأكاديمي المعياري (Academic Class Diagram)</text>
    
    
    <!-- UserController -->
    <rect x="850" y="100" width="280" height="170" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <rect x="850" y="100" width="280" height="35" fill="#1e3a8a" rx="6"/>
    <text x="990" y="123" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">UserController</text>
    <text x="865" y="155" font-size="12" fill="#334155">- int id / string name / string role</text>
    <text x="865" y="180" font-size="12" font-weight="bold" fill="#16a34a">+ login(credentials): AuthToken</text>
    <text x="865" y="205" font-size="12" font-weight="bold" fill="#16a34a">+ getProfile(userId): Profile</text>
    <text x="865" y="230" font-size="12" font-weight="bold" fill="#16a34a">+ updateBurnoutLevel(): bool</text>

    <!-- ProjectController -->
    <rect x="460" y="100" width="280" height="170" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <rect x="460" y="100" width="280" height="35" fill="#1e3a8a" rx="6"/>
    <text x="600" y="123" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">ProjectController</text>
    <text x="475" y="155" font-size="12" fill="#334155">- int projectId / double budget</text>
    <text x="475" y="180" font-size="12" font-weight="bold" fill="#16a34a">+ createProject(data): Project</text>
    <text x="475" y="205" font-size="12" font-weight="bold" fill="#16a34a">+ trackProgress(): Percentage</text>
    <text x="475" y="230" font-size="12" font-weight="bold" fill="#16a34a">+ forecastFinancialRisk(): Report</text>

    <!-- TaskManager -->
    <rect x="70" y="100" width="280" height="170" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <rect x="70" y="100" width="280" height="35" fill="#1e3a8a" rx="6"/>
    <text x="210" y="123" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">TaskManager</text>
    <text x="85" y="155" font-size="12" fill="#334155">- int taskId / string status</text>
    <text x="85" y="180" font-size="12" font-weight="bold" fill="#16a34a">+ assignTask(taskId, userId): bool</text>
    <text x="85" y="205" font-size="12" font-weight="bold" fill="#16a34a">+ updateStatusFromGit(): bool</text>
    <text x="85" y="230" font-size="12" font-weight="bold" fill="#16a34a">+ syncOfflineData(): SyncResult</text>

    <!-- OllamaAIService -->
    <rect x="70" y="320" width="280" height="160" fill="#ffffff" stroke="#6b21a8" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <rect x="70" y="320" width="280" height="35" fill="#6b21a8" rx="6"/>
    <text x="210" y="343" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">OllamaAIService</text>
    <text x="85" y="375" font-size="12" fill="#334155">- string modelName / apiEndpoint</text>
    <text x="85" y="400" font-size="12" font-weight="bold" fill="#9333ea">+ scanCodeQuality(File): Report</text>
    <text x="85" y="425" font-size="12" font-weight="bold" fill="#9333ea">+ detectVulnerabilities(): List</text>

    <!-- ProfitSharingEngine -->
    <rect x="460" y="320" width="280" height="160" fill="#ffffff" stroke="#047857" stroke-width="2" rx="6" filter="url(#shadow)"/>
    <rect x="460" y="320" width="280" height="35" fill="#047857" rx="6"/>
    <text x="600" y="343" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">ProfitSharingEngine</text>
    <text x="475" y="375" font-size="12" fill="#334155">- double totalRevenue / netProfit</text>
    <text x="475" y="400" font-size="12" font-weight="bold" fill="#10b981">+ calculateDistribution(): Array</text>
    <text x="475" y="425" font-size="12" font-weight="bold" fill="#10b981">+ disbursePayout(): Status</text>

    <!-- Associations -->
    <path d="M 850 185 L 740 185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 460 185 L 350 185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 210 270 L 210 320" stroke="#475569" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <path d="M 600 270 L 600 320" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

</svg>