<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1310 760" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; direction: rtl;">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
        </filter>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#047857" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
        <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b91c1c" />
            <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6b21a8" />
            <stop offset="100%" stop-color="#9333ea" />
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
        </marker>
    </defs>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="1310" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="655" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">الشكل (3-3): مخطط العلاقات بين الكيانات الأكاديمي (Academic ERD Diagram)</text>
    
    
    <!-- ROW 1: USERS, PROJECTS, TASKS -->
    <!-- USERS Table -->
    <g transform="translate(940, 90)">
        <rect x="0" y="0" width="290" height="210" fill="#ffffff" stroke="#1e293b" stroke-width="2" rx="8" filter="url(#shadow)"/>
        <rect x="0" y="0" width="290" height="38" fill="#1e293b" rx="8"/>
        <text x="145" y="25" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">USERS (جدول المستخدمين)</text>
        
        <text x="15" y="60" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">PK: id (bigint)</text>
        <text x="15" y="82" font-size="12" fill="#334155" text-anchor="start">name: اسم المستخدم (string)</text>
        <text x="15" y="104" font-size="12" fill="#334155" text-anchor="start">email: البريد الفريد (string UK)</text>
        <text x="15" y="126" font-size="12" fill="#334155" text-anchor="start">password: كلمة المرور (string)</text>
        <text x="15" y="148" font-size="12" fill="#334155" text-anchor="start">role: الدور الوظيفي (RBAC string)</text>
        <text x="15" y="170" font-size="12" fill="#334155" text-anchor="start">stars_count: النجوم (int)</text>
        <text x="15" y="192" font-size="12" fill="#334155" text-anchor="start">burnout_level: مؤشر الإرهاق (float)</text>
    </g>

    <!-- PROJECTS Table -->
    <g transform="translate(510, 90)">
        <rect x="0" y="0" width="290" height="210" fill="#ffffff" stroke="#1e293b" stroke-width="2" rx="8" filter="url(#shadow)"/>
        <rect x="0" y="0" width="290" height="38" fill="#1e293b" rx="8"/>
        <text x="145" y="25" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">PROJECTS (جدول المشاريع)</text>
        
        <text x="15" y="60" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">PK: id (bigint)</text>
        <text x="15" y="82" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="start">FK: client_id (bigint)</text>
        <text x="15" y="104" font-size="12" fill="#334155" text-anchor="start">name: اسم المشروع (string)</text>
        <text x="15" y="126" font-size="12" fill="#334155" text-anchor="start">budget: الميزانية الإجمالية (double)</text>
        <text x="15" y="148" font-size="12" fill="#334155" text-anchor="start">status: حالة المشروع (string)</text>
        <text x="15" y="170" font-size="12" fill="#334155" text-anchor="start">start_date: تاريخ البدء (date)</text>
        <text x="15" y="192" font-size="12" fill="#334155" text-anchor="start">end_date: تاريخ التسليم (date)</text>
    </g>

    <!-- TASKS Table -->
    <g transform="translate(80, 90)">
        <rect x="0" y="0" width="290" height="210" fill="#ffffff" stroke="#1e293b" stroke-width="2" rx="8" filter="url(#shadow)"/>
        <rect x="0" y="0" width="290" height="38" fill="#1e293b" rx="8"/>
        <text x="145" y="25" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">TASKS (جدول المهام)</text>
        
        <text x="15" y="60" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">PK: id (bigint)</text>
        <text x="15" y="82" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="start">FK: project_id (bigint)</text>
        <text x="15" y="104" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="start">FK: assigned_to (bigint)</text>
        <text x="15" y="126" font-size="12" fill="#334155" text-anchor="start">title: عنوان المهمة (string)</text>
        <text x="15" y="148" font-size="12" fill="#334155" text-anchor="start">status: حالة المهمة (string)</text>
        <text x="15" y="170" font-size="12" fill="#334155" text-anchor="start">github_commit_id: الالتزام (string)</text>
        <text x="15" y="192" font-size="12" fill="#334155" text-anchor="start">created_at: تاريخ التكليف (date)</text>
    </g>

    <!-- ROW 2: HARDWARE_SPECS, PROFIT_SHARING, AI_CODE_SCANS -->
    <!-- HARDWARE_SPECS Table -->
    <g transform="translate(940, 350)">
        <rect x="0" y="0" width="290" height="190" fill="#ffffff" stroke="#047857" stroke-width="2" rx="8" filter="url(#shadow)"/>
        <rect x="0" y="0" width="290" height="38" fill="#047857" rx="8"/>
        <text x="145" y="25" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">HARDWARE_SPECS (عهد الأجهزة)</text>
        
        <text x="15" y="60" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">PK: id (bigint)</text>
        <text x="15" y="82" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="start">FK: user_id (bigint)</text>
        <text x="15" y="104" font-size="12" fill="#334155" text-anchor="start">cpu_model: المعالج الرئيسي (string)</text>
        <text x="15" y="126" font-size="12" fill="#334155" text-anchor="start">ram_capacity: الذاكرة الرام (string)</text>
        <text x="15" y="148" font-size="12" fill="#334155" text-anchor="start">gpu_model: كرت الشاشة (string)</text>
        <text x="15" y="170" font-size="12" fill="#334155" text-anchor="start">device_sn: الرقم التسلسلي (UK)</text>
    </g>

    <!-- PROFIT_SHARING Table -->
    <g transform="translate(510, 350)">
        <rect x="0" y="0" width="290" height="190" fill="#ffffff" stroke="#047857" stroke-width="2" rx="8" filter="url(#shadow)"/>
        <rect x="0" y="0" width="290" height="38" fill="#047857" rx="8"/>
        <text x="145" y="25" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">PROFIT_SHARING (تقاسم الأرباح)</text>
        
        <text x="15" y="60" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">PK: id (bigint)</text>
        <text x="15" y="82" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="start">FK: project_id (bigint)</text>
        <text x="15" y="104" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="start">FK: user_id (bigint)</text>
        <text x="15" y="126" font-size="12" fill="#334155" text-anchor="start">percentage: نسبة العقد (double)</text>
        <text x="15" y="148" font-size="12" fill="#334155" text-anchor="start">amount_paid: المستلم (double)</text>
        <text x="15" y="170" font-size="12" fill="#334155" text-anchor="start">status: حالة الصرف (string)</text>
    </g>

    <!-- AI_CODE_SCANS Table -->
    <g transform="translate(80, 350)">
        <rect x="0" y="0" width="290" height="190" fill="#ffffff" stroke="#6b21a8" stroke-width="2" rx="8" filter="url(#shadow)"/>
        <rect x="0" y="0" width="290" height="38" fill="#6b21a8" rx="8"/>
        <text x="145" y="25" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">AI_CODE_SCANS (فحص AI)</text>
        
        <text x="15" y="60" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">PK: id (bigint)</text>
        <text x="15" y="82" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="start">FK: task_id (bigint)</text>
        <text x="15" y="104" font-size="12" fill="#334155" text-anchor="start">scan_results: التقرير (text)</text>
        <text x="15" y="126" font-size="12" fill="#334155" text-anchor="start">security_rating: الدرجة (int)</text>
        <text x="15" y="148" font-size="12" fill="#334155" text-anchor="start">scanned_at: تاريخ الفحص (date)</text>
        <text x="15" y="170" font-size="12" fill="#334155" text-anchor="start">model_used: Ollama Model (str)</text>
    </g>

    <!-- ROW 3: INVOICES, ATTENDANCE -->
    <!-- INVOICES Table -->
    <g transform="translate(725, 570)">
        <rect x="0" y="0" width="290" height="160" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" rx="8" filter="url(#shadow)"/>
        <rect x="0" y="0" width="290" height="38" fill="#1e3a8a" rx="8"/>
        <text x="145" y="25" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">INVOICES (الفواتير)</text>
        
        <text x="15" y="60" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">PK: id (bigint)</text>
        <text x="15" y="82" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="start">FK: project_id (bigint)</text>
        <text x="15" y="104" font-size="12" fill="#334155" text-anchor="start">amount: المبلغ (double)</text>
        <text x="15" y="126" font-size="12" fill="#334155" text-anchor="start">status: حالة السداد (string)</text>
        <text x="15" y="148" font-size="12" fill="#334155" text-anchor="start">due_date: تاريخ الاستحقاق (date)</text>
    </g>

    <!-- ATTENDANCE Table -->
    <g transform="translate(295, 570)">
        <rect x="0" y="0" width="290" height="160" fill="#ffffff" stroke="#1e3a8a" stroke-width="2" rx="8" filter="url(#shadow)"/>
        <rect x="0" y="0" width="290" height="38" fill="#1e3a8a" rx="8"/>
        <text x="145" y="25" fill="#ffffff" font-weight="bold" font-size="14" text-anchor="middle">ATTENDANCE (سجل التحضير)</text>
        
        <text x="15" y="60" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="start">PK: id (bigint)</text>
        <text x="15" y="82" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="start">FK: user_id (bigint)</text>
        <text x="15" y="104" font-size="12" fill="#334155" text-anchor="start">check_in / check_out (timestamp)</text>
        <text x="15" y="126" font-size="12" fill="#334155" text-anchor="start">session_duration: الساعات (float)</text>
        <text x="15" y="148" font-size="12" fill="#334155" text-anchor="start">device_verified: كود الجهاز (bool)</text>
    </g>

    <!-- Connecting Relationship Lines with Clear Arrows -->
    <!-- USERS -> PROJECTS -->
    <path d="M 940 195 L 800 195" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <!-- PROJECTS -> TASKS -->
    <path d="M 510 195 L 370 195" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <!-- USERS -> HARDWARE_SPECS -->
    <path d="M 1085 300 L 1085 350" stroke="#047857" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <!-- PROJECTS -> PROFIT_SHARING -->
    <path d="M 655 300 L 655 350" stroke="#047857" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <!-- TASKS -> AI_CODE_SCANS -->
    <path d="M 225 300 L 225 350" stroke="#6b21a8" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <!-- PROJECTS -> INVOICES -->
    <path d="M 655 300 L 655 570 M 655 570 L 725 570" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
    <!-- USERS -> ATTENDANCE -->
    <path d="M 1085 300 L 1085 550 M 1085 550 L 440 550 M 440 550 L 440 570" stroke="#1e3a8a" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow)"/>

</svg>