<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; direction: rtl;">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
        </filter>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#047857" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
        <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b91c1c" />
            <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6b21a8" />
            <stop offset="100%" stop-color="#9333ea" />
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
        </marker>
    </defs>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="1200" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">الشكل (3-4): مخطط حالات الاستخدام الأكاديمي (Academic Use Case Diagram)</text>
    
    
    <!-- Boundary Box -->
    <rect x="350" y="80" width="500" height="420" fill="#f8fafc" stroke="#2563eb" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="600" y="110" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e3a8a">حدود نظام إدارة ومتابعة المشاريع</text>

    <!-- Use Cases -->
    <ellipse cx="600" cy="150" rx="180" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="600" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">UC-01: تسجيل الدخول والتحقق من RBAC</text>

    <ellipse cx="600" cy="210" rx="180" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="600" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">UC-02: متابعة نسبة الإنجاز والمالية</text>

    <ellipse cx="600" cy="270" rx="180" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="600" y="275" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">UC-03: تسجيل التحضير وحصر العهد</text>

    <ellipse cx="600" cy="330" rx="180" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="600" y="335" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">UC-04: تشغيل فحص الكود محلياً بالـ AI</text>

    <ellipse cx="600" cy="390" rx="180" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="600" y="395" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">UC-05: طلب وتوفير جلسة استشارية</text>

    <ellipse cx="600" cy="450" rx="180" ry="25" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="600" y="455" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">UC-06: أتمتة تقاسم الأرباح والعهد</text>

    <!-- Actors Right -->
    <rect x="920" y="160" width="180" height="70" fill="#ffffff" stroke="#1e293b" stroke-width="2" rx="8" filter="url(#shadow)"/>
    <text x="1010" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">العميل (Client)</text>
    <path d="M 920 195 L 780 210" stroke="#475569" stroke-width="1.5"/>

    <rect x="920" y="300" width="180" height="70" fill="#ffffff" stroke="#1e293b" stroke-width="2" rx="8" filter="url(#shadow)"/>
    <text x="1010" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">المطور (Developer)</text>
    <path d="M 920 335 L 780 270" stroke="#475569" stroke-width="1.5"/>
    <path d="M 920 335 L 780 330" stroke="#475569" stroke-width="1.5"/>

    <!-- Actors Left -->
    <rect x="100" y="160" width="180" height="70" fill="#ffffff" stroke="#1e293b" stroke-width="2" rx="8" filter="url(#shadow)"/>
    <text x="190" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">الخبير (Consultant)</text>
    <path d="M 280 195 L 420 390" stroke="#475569" stroke-width="1.5"/>

    <rect x="100" y="300" width="180" height="70" fill="#ffffff" stroke="#1e293b" stroke-width="2" rx="8" filter="url(#shadow)"/>
    <text x="190" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">المدير (Admin)</text>
    <path d="M 280 335 L 420 450" stroke="#475569" stroke-width="1.5"/>

</svg>