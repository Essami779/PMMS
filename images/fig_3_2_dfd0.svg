<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; direction: rtl;">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
        </filter>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#047857" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
        <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b91c1c" />
            <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6b21a8" />
            <stop offset="100%" stop-color="#9333ea" />
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
        </marker>
    </defs>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="1200" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">الشكل (3-2): المخطط الصفري الأكاديمي للنظام (Level-0 DFD Diagram)</text>
    
    
    <!-- Processes -->
    <circle cx="1000" cy="180" r="55" fill="url(#primaryGrad)" filter="url(#shadow)"/>
    <text x="1000" y="175" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">1.0</text>
    <text x="1000" y="195" fill="#ffffff" font-size="11" text-anchor="middle">إدارة الصلاحيات والتحضير</text>

    <circle cx="800" cy="380" r="55" fill="url(#primaryGrad)" filter="url(#shadow)"/>
    <text x="800" y="375" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2.0</text>
    <text x="800" y="395" fill="#ffffff" font-size="11" text-anchor="middle">المزامنة أوفلاين</text>

    <circle cx="600" cy="180" r="55" fill="url(#primaryGrad)" filter="url(#shadow)"/>
    <text x="600" y="175" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">3.0</text>
    <text x="600" y="195" fill="#ffffff" font-size="11" text-anchor="middle">أتمتة المهام وDevOps</text>

    <circle cx="400" cy="380" r="55" fill="url(#purpleGrad)" filter="url(#shadow)"/>
    <text x="400" y="375" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">4.0</text>
    <text x="400" y="395" fill="#ffffff" font-size="11" text-anchor="middle">فحص الكود بالـ AI</text>

    <circle cx="200" cy="180" r="55" fill="url(#accentGrad)" filter="url(#shadow)"/>
    <text x="200" y="175" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">5.0</text>
    <text x="200" y="195" fill="#ffffff" font-size="11" text-anchor="middle">المحاسبة وتقاسم الأرباح</text>

    <!-- Data Stores -->
    <rect x="910" y="270" width="180" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="5"/>
    <text x="1000" y="295" font-size="12" fill="#14532d" text-anchor="middle">D1: مستودع المستخدمين والعهد</text>

    <rect x="710" y="470" width="180" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="5"/>
    <text x="800" y="495" font-size="12" fill="#14532d" text-anchor="middle">D2: التخزين المحلي SQLite</text>

    <rect x="510" y="270" width="180" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="5"/>
    <text x="600" y="295" font-size="12" fill="#14532d" text-anchor="middle">D3: قاعدة البيانات الرئيسية PostgreSQL</text>

    <rect x="310" y="470" width="180" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="5"/>
    <text x="400" y="495" font-size="12" fill="#14532d" text-anchor="middle">D5: سجل فحص الجودة والأمان</text>

    <rect x="110" y="270" width="180" height="40" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="5"/>
    <text x="200" y="295" font-size="12" fill="#14532d" text-anchor="middle">D6: سجل العقود والأرباح</text>

</svg>