<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; direction: rtl;">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
        </filter>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#047857" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
        <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b91c1c" />
            <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6b21a8" />
            <stop offset="100%" stop-color="#9333ea" />
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
        </marker>
    </defs>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="1200" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">الشكل (3-1): المخطط البيئي الأكاديمي للنظام (Context Diagram - Level 0)</text>
    
    
    <circle cx="600" cy="270" r="110" fill="url(#primaryGrad)" stroke="#1d4ed8" stroke-width="4" filter="url(#shadow)"/>
    <text x="600" y="250" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">0.0</text>
    <text x="600" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">نظام إدارة ومتابعة المشاريع</text>
    <text x="600" y="295" text-anchor="middle" font-size="13" fill="#93c5fd">(Central System Level 0)</text>

    <!-- Client -->
    <rect x="920" y="90" width="220" height="90" fill="#f8fafc" stroke="#1e293b" stroke-width="2" rx="8" filter="url(#shadow)"/>
    <text x="1030" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">العميل (Client Entity)</text>
    <text x="1030" y="150" text-anchor="middle" font-size="12" fill="#64748b">طلبات المشاريع والفواتير</text>
    <path d="M 920 135 L 710 230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Employee -->
    <rect x="920" y="350" width="220" height="90" fill="#f8fafc" stroke="#1e293b" stroke-width="2" rx="8" filter="url(#shadow)"/>
    <text x="1030" y="385" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">الموظف / المشرف</text>
    <text x="1030" y="410" text-anchor="middle" font-size="12" fill="#64748b">التحضير الذكي، المهام، الأكواد</text>
    <path d="M 920 395 L 710 310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Expert -->
    <rect x="60" y="350" width="220" height="90" fill="#f8fafc" stroke="#1e293b" stroke-width="2" rx="8" filter="url(#shadow)"/>
    <text x="170" y="385" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">الخبير / المستشار</text>
    <text x="170" y="410" text-anchor="middle" font-size="12" fill="#64748b">تقديم الاستشارات والتقييمات</text>
    <path d="M 280 395 L 490 310" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Recruiter -->
    <rect x="60" y="90" width="220" height="90" fill="#f8fafc" stroke="#1e293b" stroke-width="2" rx="8" filter="url(#shadow)"/>
    <text x="170" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">جهة التوظيف</text>
    <text x="170" y="150" text-anchor="middle" font-size="12" fill="#64748b">طلب التوظيف، تصفح الكفاءات</text>
    <path d="M 280 135 L 490 230" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- GitHub -->
    <rect x="490" y="70" width="220" height="65" fill="#faf5ff" stroke="#7e22ce" stroke-width="2" rx="8" filter="url(#shadow)"/>
    <text x="600" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#581c87">خدمة GitHub الخارجية</text>
    <text x="600" y="120" text-anchor="middle" font-size="12" fill="#7e22ce">Webhooks &amp; APIs</text>
    <path d="M 600 135 L 600 160" stroke="#7e22ce" stroke-width="2" marker-end="url(#arrow)"/>

</svg>