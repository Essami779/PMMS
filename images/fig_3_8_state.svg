<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; direction: rtl;">
    <defs>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
        </filter>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#1e3a8a" />
            <stop offset="100%" stop-color="#2563eb" />
        </linearGradient>
        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#047857" />
            <stop offset="100%" stop-color="#10b981" />
        </linearGradient>
        <linearGradient id="warnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#b91c1c" />
            <stop offset="100%" stop-color="#ef4444" />
        </linearGradient>
        <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6b21a8" />
            <stop offset="100%" stop-color="#9333ea" />
        </linearGradient>
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
        </marker>
    </defs>
    
    <!-- Title Bar -->
    <rect x="0" y="0" width="1200" height="60" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <text x="600" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">الشكل (3-8): مخطط الحالة لدورة حياة المهمة والتكامل مع Git</text>
    
    
    <rect x="50" y="180" width="180" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="140" y="215" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">1. مهمة جديدة</text>

    <path d="M 230 210 L 300 210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="300" y="180" width="180" height="60" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="390" y="215" font-size="14" font-weight="bold" fill="#1e3a8a" text-anchor="middle">2. قيد التنفيذ (أوفلاين)</text>

    <path d="M 480 210 L 550 210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="550" y="180" width="180" height="60" fill="#faf5ff" stroke="#7e22ce" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="640" y="215" font-size="14" font-weight="bold" fill="#6b21a8" text-anchor="middle">3. فحص الذكاء الاصطناعي</text>

    <path d="M 730 210 L 800 210" stroke="#15803d" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="800" y="180" width="180" height="60" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="10" filter="url(#shadow)"/>
    <text x="890" y="215" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">4. اجتياز الجودة والأمان</text>

    <path d="M 980 210 L 1050 210" stroke="#15803d" stroke-width="2" marker-end="url(#arrow)"/>

    <circle cx="1090" cy="210" r="16" fill="none" stroke="#0f172a" stroke-width="2"/>
    <circle cx="1090" cy="210" r="10" fill="#0f172a"/>

</svg>